name: Update Monthly Contributions Graph

on:
  schedule:
    # Run everyday at midnight UTC
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-graph:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Generate monthly graph
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python scripts/generate_monthly_graph.py

      - name: Commit and push changes
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git add images/github-monthly-contributions-2026.svg
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore(cron): auto-update monthly contributions graph [skip ci]"
            git push
          fi
